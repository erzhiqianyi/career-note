<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">02 役割：Agent が提案し、本人が確かめる</title><desc id="desc">本人が求人と依頼を登録し、外部 Agent が調査と資料作成、本人が根拠を確認して取り込み、面接練習へ進む。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#367bac"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="40" y="52" font-size="30" fill="#18334f">02 役割：Agent が提案し、本人が確かめる</text><rect x="40" y="115" width="330" height="150" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="62" y="152" font-size="24" fill="#18334f">1 本人が記録</text><text x="62" y="191" font-size="19" fill="#18334f">求人・出典・希望条件</text><text x="62" y="221" font-size="19" fill="#18334f">何を準備するか決める</text><rect x="435" y="115" width="330" height="150" rx="16" fill="#fff4df" stroke="#7b9cb8"/><text x="457" y="152" font-size="24" fill="#18334f">2 外部 Agent が作成</text><text x="457" y="191" font-size="19" fill="#18334f">原文を調査し下書きする</text><text x="457" y="221" font-size="19" fill="#18334f">不明な事実は不明のまま</text><rect x="830" y="115" width="330" height="150" rx="16" fill="#eaf8f4" stroke="#7b9cb8"/><text x="852" y="152" font-size="24" fill="#18334f">3 本人が確認</text><text x="852" y="191" font-size="19" fill="#18334f">事実・出典・応募先を確認</text><text x="852" y="221" font-size="19" fill="#18334f">自動応募はしない</text><path d="M375 190 L426 190" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770 190 L821 190" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="150" y="365" width="400" height="150" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="172" y="402" font-size="24" fill="#18334f">4 ローカルに取り込む</text><text x="172" y="441" font-size="19" fill="#18334f">CLI / Web → Worker API</text><text x="172" y="471" font-size="19" fill="#18334f">保存後に対象 ID を読戻す</text><rect x="650" y="365" width="400" height="150" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="672" y="402" font-size="24" fill="#18334f">5 面接を練習する</text><text x="672" y="441" font-size="19" fill="#18334f">元回答を残す</text><text x="672" y="471" font-size="19" fill="#18334f">添削と比較して次の練習へ</text><path d="M995 270 L995 302 L350 302 L350 355" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M552 440 L640 440" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="584" font-size="22" fill="#18334f">注意：依頼をキューに入れただけでは、文章生成・添削は完了していない。</text></g></svg>
