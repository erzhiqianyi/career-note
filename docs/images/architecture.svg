<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">01 しくみ：業務データは自分の PC に保存</title><desc id="desc">PC 内の React 画面、Worker API、ローカル D1。Google 認証と外部 Agent は任意の外部通信。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#367bac"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="40" y="52" font-size="30" fill="#18334f">01 しくみ：業務データは自分の PC に保存</text><rect x="24" y="90" width="1152" height="280" rx="20" fill="#f5f9fc" stroke="#a9bdcc"/><text x="46" y="124" font-size="20" fill="#18334f">自分の PC / ループバック接続</text><rect x="48" y="155" width="300" height="165" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="70" y="192" font-size="24" fill="#18334f">画面</text><text x="70" y="231" font-size="19" fill="#18334f">React / vinext</text><text x="70" y="261" font-size="19" fill="#18334f">localhost:4318</text><text x="70" y="291" font-size="19" fill="#18334f">入力・一覧・面接練習</text><rect x="450" y="155" width="300" height="165" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="472" y="192" font-size="24" fill="#18334f">Worker API</text><text x="472" y="231" font-size="19" fill="#18334f">127.0.0.1:4319</text><text x="472" y="261" font-size="19" fill="#18334f">認証・検証・保存処理</text><rect x="850" y="155" width="300" height="165" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="872" y="192" font-size="24" fill="#18334f">ローカル D1</text><text x="872" y="231" font-size="19" fill="#18334f">求人・資料・元回答</text><text x="872" y="261" font-size="19" fill="#18334f">worker-state/</text><text x="872" y="291" font-size="19" fill="#18334f">Git には入れない</text><path d="M350 230 L444 230" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="354" y="215" font-size="17" fill="#18334f">/api</text><path d="M754 230 L844 230" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="420" width="460" height="130" rx="16" fill="#fff4df" stroke="#7b9cb8"/><text x="70" y="457" font-size="24" fill="#18334f">Google / Firebase（任意）</text><text x="70" y="496" font-size="19" fill="#18334f">ログイン・ID トークン・公開鍵</text><rect x="690" y="420" width="460" height="130" rx="16" fill="#eaf8f4" stroke="#7b9cb8"/><text x="712" y="457" font-size="24" fill="#18334f">外部 Agent（任意）</text><text x="712" y="496" font-size="19" fill="#18334f">調査・下書き → 本人確認 → API 取込</text><path d="M276 420 L276 375" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M720 418 L648 375" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="594" font-size="21" fill="#18334f">クラウド DB への自動アップロードなし。外部サービスへ渡す情報は本人が管理する。</text></g></svg>
