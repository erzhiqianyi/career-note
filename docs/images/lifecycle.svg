<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">03 開発工程：目的を決め、確かめて、改善する</title><desc id="desc">企画、計画、要件、設計、実装、テスト、配布、運用を結び、運用から企画へフィードバックする。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#367bac"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="40" y="52" font-size="30" fill="#18334f">03 開発工程：目的を決め、確かめて、改善する</text><rect x="40" y="110" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="62" y="147" font-size="24" fill="#18334f">企画</text><text x="62" y="186" font-size="19" fill="#18334f">課題・目的・範囲</text><text x="62" y="216" font-size="19" fill="#18334f">G0：着手判断</text><rect x="330" y="110" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="352" y="147" font-size="24" fill="#18334f">計画</text><text x="352" y="186" font-size="19" fill="#18334f">予算・WBS・体制</text><text x="352" y="216" font-size="19" fill="#18334f">G1：費用と日程</text><rect x="620" y="110" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="642" y="147" font-size="24" fill="#18334f">要件</text><text x="642" y="186" font-size="19" fill="#18334f">機能・非機能</text><text x="642" y="216" font-size="19" fill="#18334f">G2：受入条件</text><rect x="910" y="110" width="250" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="932" y="147" font-size="24" fill="#18334f">設計</text><text x="932" y="186" font-size="19" fill="#18334f">画面・API・データ</text><text x="932" y="216" font-size="19" fill="#18334f">G3：方式レビュー</text><path d="M283 180 L322 180" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M573 180 L612 180" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M863 180 L902 180" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1035 260 L1035 335" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="910" y="345" width="250" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="932" y="382" font-size="24" fill="#18334f">実装</text><text x="932" y="421" font-size="19" fill="#18334f">コード・レビュー</text><text x="932" y="451" font-size="19" fill="#18334f">要件 ID と対応</text><rect x="620" y="345" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="642" y="382" font-size="24" fill="#18334f">テスト</text><text x="642" y="421" font-size="19" fill="#18334f">自動試験・受入</text><text x="642" y="451" font-size="19" fill="#18334f">G4：品質判定</text><rect x="330" y="345" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="352" y="382" font-size="24" fill="#18334f">配布</text><text x="352" y="421" font-size="19" fill="#18334f">導入・移行・復旧</text><text x="352" y="451" font-size="19" fill="#18334f">G5：リリース</text><rect x="40" y="345" width="240" height="145" rx="16" fill="#eaf4fc" stroke="#7b9cb8"/><text x="62" y="382" font-size="24" fill="#18334f">運用・廃止</text><text x="62" y="421" font-size="19" fill="#18334f">バックアップ・改善</text><text x="62" y="451" font-size="19" fill="#18334f">G6：継続判断</text><path d="M905 417 L870 417" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M615 417 L580 417" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M325 417 L290 417" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M160 340 L160 267" stroke="#367bac" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="570" font-size="22" fill="#18334f">小さな機能ごとに反復できる。文書は合意と判断を残すために使う。</text></g></svg>
