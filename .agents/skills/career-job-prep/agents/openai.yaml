interface:
  display_name: "日本求职准备"
  short_description: "根据真实履历寻找日本公司，核验岗位并生成专属简历、证据映射和面试练习"
  default_prompt: "使用 $career-job-prep，结合 Career Note 的最新履历与求职条件，完成我本轮要求的求职准备。未指定范围时，核验最多 5 个候选岗位，并为依据充分且匹配的 1 个岗位生成公司研究、履歴書、職務経歴書、志望動機、面试准备及模拟题组。先说明采用的范围再继续；关键事实不足时先确认，不强凑适合岗位。保留来源、未知项及历史版本，通过已配置的 MCP 分批保存并读回。不要改动履历、投递状态或发送申请。"
